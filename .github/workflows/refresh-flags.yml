name: Refresh injury flags

# Between the weekly refreshes: latest status / chance of playing / news / prices from FPL,
# then re-run the projections (scripts/refresh_flags.py, under a minute). Commits only when a flag
# or price moved, and does nothing once the gameweek deadline has passed.
on:
  workflow_dispatch:
  schedule:
    # Mornings and after the Thursday/Friday press conferences; no 06:00 Tuesday clash with the weekly run
    - cron: '30 8,13,17,21 * * *'

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh-flags:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh flags and projections
        run: python scripts/refresh_flags.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current/
          git diff --staged --quiet && exit 0
          git commit -m "Injury flags refresh"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "push attempt $attempt failed, retrying…"; sleep 15
          done
